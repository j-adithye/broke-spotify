<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Swave{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="top-bar">
    <a href="/" class="home-icon" id="home-link" aria-label="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
            <path d="M3 9L12 2L21 9V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9Z"/>
        </svg>
    </a>

    <form action="/result/" method="GET" class="search-form">
        <input type="text" name="query" placeholder="Search songs, artists…" autocomplete="off">
        <button type="submit" aria-label="Search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>
    </form>

    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>
</nav>

<div class="player-bar">
    <div class="player-top">
        <div class="player-info">
            <img id="player-image" src="" alt="">
            <div class="player-text">
                <p id="player-title">No song playing</p>
                <p id="player-artist"></p>
            </div>
        </div>

        <div class="player-controls">
            <button id="queue-btn" class="icon-btn" aria-label="Queue">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                    <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                    <circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/>
                </svg>
            </button>
            <button id="prev-btn" aria-label="Previous">&#9664;&#9664;</button>
            <button id="play-pause-btn" class="play-btn" aria-label="Play">&#9654;</button>
            <button id="next-btn" aria-label="Next">&#9654;&#9654;</button>
            <button id="repeat-btn" class="icon-btn" aria-label="Repeat">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                    <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                    <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
            </button>
        </div>

        <button class="icon-btn mobile-queue-btn" id="mobile-queue-btn" aria-label="Queue" style="display:none">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                <circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/>
            </svg>
        </button>

        <div class="player-side">
            <button id="mute-btn" class="icon-btn" aria-label="Mute">
                <svg id="vol-icon-high" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <svg id="vol-icon-low" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="display:none">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <svg id="vol-icon-mute" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="display:none">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </button>
            <input type="range" id="volume-bar" value="100" min="0" max="100" aria-label="Volume">
        </div>
    </div><!-- /.player-top -->

    <div class="player-bottom">
        <span id="current-time" class="time-mono">0:00</span>
        <input type="range" id="seek-bar" value="0" min="0" max="100" aria-label="Seek">
        <span id="duration" class="time-mono">0:00</span>
    </div>
</div>

<div id="queue-modal" class="queue-modal hidden">
    <div class="queue-header">
        <h3>Queue</h3>
        <button id="close-queue-btn" aria-label="Close queue">&times;</button>
    </div>
    <div id="queue-list"></div>
</div>

<audio id="audio-player"></audio>

<!-- ── MOBILE FULL-SCREEN PLAYER ── -->
<div id="mobile-player" class="mobile-player hidden" aria-modal="true" role="dialog">
    <div class="mp-handle-bar">
        <div class="mp-handle"></div>
    </div>

    <div class="mp-art-wrap">
        <img id="mp-image" src="" alt="">
    </div>

    <div class="mp-meta">
        <div class="mp-text">
            <p id="mp-title">No song playing</p>
            <p id="mp-artist"></p>
        </div>
    </div>

    <div class="mp-seek-wrap">
        <input type="range" id="mp-seek-bar" value="0" min="0" max="100" aria-label="Seek">
        <div class="mp-times">
            <span id="mp-current-time" class="time-mono">0:00</span>
            <span id="mp-duration" class="time-mono">0:00</span>
        </div>
    </div>

    <!-- inline queue panel -->
    <div id="mp-queue-panel" class="mp-queue-panel hidden">
        <div class="mp-queue-panel-header">
            <span>Up Next</span>
            <button id="mp-close-queue-btn" aria-label="Close queue">&times;</button>
        </div>
        <div id="mp-queue-list" class="mp-queue-list"></div>
    </div>

    <div class="mp-controls">
        <button id="mp-queue-btn" class="mp-icon-btn" aria-label="Queue">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                <circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/>
            </svg>
        </button>
        <button id="mp-prev-btn" class="mp-icon-btn" aria-label="Previous">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
        </button>
        <button id="mp-play-pause-btn" class="mp-play-btn" aria-label="Play">
            <svg id="mp-icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="mp-icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="mp-next-btn" class="mp-icon-btn" aria-label="Next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 3.9V8.1L8.5 12zM16 6h2v12h-2z"/>
            </svg>
        </button>
        <button id="mp-repeat-btn" class="mp-icon-btn" aria-label="Repeat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
        </button>
    </div>
</div>
<div id="mp-backdrop" class="mp-backdrop hidden"></div>

<div id="main-content">
    {% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
