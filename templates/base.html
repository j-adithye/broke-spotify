<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    
<div class="search-bar">
    <a href="/" class="home-icon">&#8962;</a>
        <form action="/result/" method="GET">
            <input type="text" name="query" placeholder="Search songs...">
            <button type="submit">Search</button>
        </form>
    </div>


    <div class="player-bar">
    <div class="player-info">
        <img id="player-image" src="" alt="">
        <div>
            <p id="player-title">No song playing</p>
            <p id="player-artist"></p>
        </div>
    </div>

    <div class="player-controls">
    <button id="prev-btn">&#9664;&#9664;</button>
    <button id="play-pause-btn">&#9654;</button>
    <button id="next-btn">&#9654;&#9654;</button>
    <button id="queue-btn">&#9776;</button>
    <input type="range" id="seek-bar" value="0" min="0" max="100">
    <span id="current-time">0:00</span> / <span id="duration">0:00</span>
</div>
</div>

<div id="queue-modal" class="queue-modal hidden">
    <div class="queue-header">
        <h3>Queue</h3>
        <button id="close-queue-btn">&times;</button>
    </div>
    <div id="queue-list"></div>
</div>

<audio id="audio-player"></audio>
<div id="main-content">
    {% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
