<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Swave{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <!-- Hamburger (mobile only) -->
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <svg
          class="logo-mark"
          viewBox="0 0 28 28"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect x="2" y="8" width="4" height="12" rx="2" fill="currentColor" />
          <rect x="8" y="4" width="4" height="20" rx="2" fill="currentColor" />
          <rect
            x="14"
            y="10"
            width="4"
            height="14"
            rx="2"
            fill="currentColor"
          />
          <rect x="20" y="6" width="4" height="16" rx="2" fill="currentColor" />
        </svg>
        <span class="logo-text">Swave</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/" class="nav-item {% block nav_home %}{% endblock %}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h4a1 1 0 001-1v-3h2v3a1 1 0 001 1h4a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"
            />
          </svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item {% block nav_search %}{% endblock %}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd"
            />
          </svg>
          <span>Search</span>
        </a>
        <a href="#" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"
            />
          </svg>
          <span>Library</span>
        </a>
      </nav>

      <div class="sidebar-divider"></div>

      <p class="sidebar-section-label">Recents</p>
      <div class="sidebar-recents" id="sidebar-recents">
        <!-- Populated by JS -->
        <p class="sidebar-empty-hint">Songs you play will appear here</p>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper" id="main-wrapper">
      <!-- Top Bar -->
      <header class="top-bar">
        <form class="search-form" action="/result/" method="GET">
          <div class="search-input-wrap">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              type="text"
              name="query"
              placeholder="Search artists, songs, albums…"
              autocomplete="off"
            />
            <button type="submit" class="btn-search">Search</button>
          </div>
        </form>
      </header>

      <!-- Page Content -->
      <main class="page-content">{% block content %}{% endblock %}</main>
    </div>

    <!-- Player Bar -->
    <footer class="player-bar" id="player-bar">
      <!-- Left: Song Info -->
      <div class="player-info">
        <div class="player-art-wrap">
          <img id="player-image" src="" alt="Album art" />
          <div class="player-art-placeholder" id="player-placeholder">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"
              />
            </svg>
          </div>
        </div>
        <div class="player-meta">
          <p id="player-title" class="player-title">No song playing</p>
          <p id="player-artist" class="player-artist">—</p>
        </div>
      </div>

      <!-- Center: Controls + Seekbar -->
      <div class="player-center">
        <div class="player-controls">
          <button id="prev-btn" class="ctrl-btn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
          </button>
          <button
            id="play-pause-btn"
            class="ctrl-btn play-btn"
            aria-label="Play / Pause"
          >
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg
              id="pause-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="display: none"
            >
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button id="next-btn" class="ctrl-btn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"
              />
            </svg>
          </button>
        </div>
        <div class="player-progress">
          <span id="current-time" class="time-label">0:00</span>
          <div class="seek-wrap">
            <input
              type="range"
              id="seek-bar"
              value="0"
              min="0"
              max="100"
              step="0.1"
            />
          </div>
          <span id="duration" class="time-label">0:00</span>
        </div>
      </div>

      <!-- Right: Volume -->
      <div class="player-right">
        <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
          />
        </svg>
        <input
          type="range"
          id="volume-bar"
          class="volume-bar"
          value="100"
          min="0"
          max="100"
        />
      </div>
    </footer>

    <audio id="audio-player"></audio>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <script>
      // Hamburger toggle
      const hamburger = document.getElementById("hamburger");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const mainWrap = document.getElementById("main-wrapper");
      const songGrid = document.querySelector(".song-grid");

      hamburger.addEventListener("click", () => {
        sidebar.classList.toggle("expanded");
        overlay.classList.toggle("visible");
        hamburger.classList.toggle("open");
        if (songGrid) songGrid.classList.toggle("resize");
      });

      overlay.addEventListener("click", () => {
        sidebar.classList.remove("expanded");
        overlay.classList.remove("visible");
        hamburger.classList.remove("open");
        if (songGrid) songGrid.classList.remove("resize");
      });

      // Seek bar fill via CSS var
      const seekBar = document.getElementById("seek-bar");
      if (seekBar) {
        const updateFill = () => {
          const pct = (seekBar.value / seekBar.max) * 100;
          seekBar.style.setProperty("--fill", `${pct}%`);
        };
        seekBar.addEventListener("input", updateFill);
        updateFill();
      }

      // Volume bar fill
      const volumeBar = document.getElementById("volume-bar");
      if (volumeBar) {
        const updateVolFill = () => {
          const pct = (volumeBar.value / volumeBar.max) * 100;
          volumeBar.style.setProperty("--fill", `${pct}%`);
          const audio = document.getElementById("audio-player");
          if (audio) audio.volume = volumeBar.value / 100;
        };
        volumeBar.addEventListener("input", updateVolFill);
        updateVolFill();
      }

      // Hide placeholder when image loads
      const playerImg = document.getElementById("player-image");
      const placeholder = document.getElementById("player-placeholder");
      if (playerImg) {
        playerImg.addEventListener("load", () => {
          if (playerImg.src && !playerImg.src.endsWith("/")) {
            placeholder.style.display = "none";
            playerImg.style.display = "block";
          }
        });
      }
    </script>
  </body>
</html>
