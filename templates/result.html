{% extends "base.html" %}

{% block content %}



    <div class="song-grid">
        {% for song in songs %}
        <div class="song-card"
        data-url="{{ song.media_url }}"
        data-title="{{ song.title }}"
        data-artist="{{ song.singers }}"
        data-image="{{ song.thumbnails }}"
        data-videoId="{{song.videoId}}">

            <img src="{{ song.image }}" alt="{{ song.title }}">
            <p class="song-title">{{ song.title }}</p>
            <p class="song-artist">{{ song.singers }}</p>
        </div>
        {% endfor %}
    </div>

{% endblock %}
